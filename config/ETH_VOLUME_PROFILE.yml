# Bot "Fixed Range Volume Profile" (EF-96, demande de l'utilisateur du 2026-10-01).
# Reglage "retour vers le POC, plage = semaine precedente" : le moins mauvais de la
# grille mesuree (scripts/bench_volume_profile.py, 2025-2026, 4 marches) - et
# pourtant mediane NEGATIVE (-1,8 %), 6 fenetres gagnantes sur 16. Aucun avantage
# demontre : bot d'observation en paper, pas une strategie validee.
name: ETH_VOLUME_PROFILE
exchange: binance
symbol: ETH/USDT
timeframe: 1h
# Au moins une semaine complete d'historique pour le premier profil de reference.
warmup_candles: 400
# OBLIGATOIRE a false : le compte testnet est partage avec ETH_youenn et
# ETH_TREND_REGIME. A true, le premier lancement vendrait leur ETH (incident du
# 2026-09-26 : 0,2629 ETH liquides au demarrage d'ETH_youenn).
flatten_on_start: false
capital_allocated: 200.0
strategy:
  type: volume_profile
  mode: reversion          # achat au retour dans la zone de valeur apres un passage sous le VAL
  anchor: period           # plage fixe = periode precedente terminee
  range_hours: 168         # la semaine precedente (lundi 00:00 -> dimanche 23:59 UTC)
  rows: 50
  value_area_pct: 0.7
  confirm_candles: 1       # 1 cloture horaire dans la zone suffit
  target: poc              # vend au POC de la semaine precedente
  stop_buffer_pct: 0.01    # ... ou si une cloture repasse 1 % sous le VAL
risk:
  max_position_size_pct: 1.0
  stop_loss_pct: null      # la sortie de perte est l'invalidation de la strategie
  take_profit_pct: null
  max_daily_loss_pct: 0.05
  max_concurrent_positions: 1
  trailing_stop_pct: null
  fee_pct: 0.001
  partial_take_profit_pct: null
  partial_exit_fraction: 0.5
  profit_lock_arm_pct: null
  profit_lock_trigger_pct: null
backtest:
  starting_capital: 1000
  since: '2025-01-01T00:00:00Z'
