[project]
name = "tradingbot"
version = "0.1.0"
description = "Bot de trading automatise - MVP crypto (backtest/paper)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
